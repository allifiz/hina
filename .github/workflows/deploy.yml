name: Deploy Hina to Azure VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            set -e

            cd ${{ secrets.AZURE_APP_PATH }}

            # Runtime files are not deploy artifacts. Back them up BEFORE git reset.
            # database.json is still tracked by Git, so restore its live copy afterwards.
            umask 077
            mkdir -p "$HOME/hina-backups"
            DEPLOY_BACKUP="$(mktemp -d "$HOME/hina-backups/deploy-XXXXXXXX")"
            [ ! -f .env ] || cp -p .env "$DEPLOY_BACKUP/.env"
            [ ! -f database.json ] || cp -p database.json "$DEPLOY_BACKUP/database.json"
            [ ! -f "$HOME/hina-data/database.json" ] || cp -p "$HOME/hina-data/database.json" "$DEPLOY_BACKUP/database-external.json"
            [ ! -d auth_info_baileys ] || cp -a auth_info_baileys "$DEPLOY_BACKUP/auth_info_baileys"

            echo "Pulling latest main..."
            git fetch origin main
            git reset --hard origin/main
            if [ -f "$DEPLOY_BACKUP/database.json" ]; then
              cp -p "$DEPLOY_BACKUP/database.json" ./database.json
            fi

            echo "Installing dependencies..."
            npm install --omit=dev

            echo "Checking syntax..."
            node --check index.js
            node --check config.js
            node --check services/ai.js
            npm test

            echo "Restarting Hina service..."
            sudo -n systemctl restart hina

            echo "Waiting for app startup..."
            sleep 8
            if ! sudo -n systemctl is-active --quiet hina; then
              echo "Hina stopped after deployment. Recent journal:"
              sudo -n journalctl -u hina -n 40 --no-pager || true
              exit 1
            fi

            echo "Checking service status..."
            sudo -n systemctl status hina --no-pager
