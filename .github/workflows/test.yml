name: Test Hina Changes

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check modified modules
        run: |
          node --check config.js
          node --check index.js
          node --check services/ai.js
          node --check services/database.js
          node --check services/mood.js
          node --check handlers/services.js
      - name: Run tests without provider calls
        run: npm test
